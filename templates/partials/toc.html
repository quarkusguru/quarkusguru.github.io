{#if page.data.toc??}
<aside class="post-toc">
  <nav class="post-toc__inner toc-sticky">
    <p class="post-toc__title">On this page</p>
    <ol class="toc-list" id="toc-list">
      {#if page.data.toc.size?? && page.data.toc.size > 0}
      {#for item in page.data.toc}
      <li class="toc-item toc-h2">
        <a href="#{item.id}" class="toc-link" data-target="{item.id}">{item.title}</a>
        {#if item.subsections??}
        <ul class="toc-sublist">
          {#for subsection in item.subsections}
          <li class="toc-item toc-h3">
            <a href="#{subsection.id}" class="toc-link" data-target="{item.id}">{subsection.title}</a>
          </li>
          {/for}
        </ul>
        {/if}
      </li>
      {/for}
      {/if}
    </ol>
  </nav>
</aside>
{/if}
